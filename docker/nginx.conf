server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /library {
        return 301 /library/;
    }

    location ^~ /library/ {
        proxy_pass http://catalogue:8765/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /files/ {
        proxy_pass http://catalogue:8765/files/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
