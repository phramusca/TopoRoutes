server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /library {
        return 301 /library/;
    }

    location ^~ /library/ {
        proxy_pass http://catalogue:8765/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /files/ {
        proxy_pass http://catalogue:8765/files/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /gpx-proxy/styles/ {
        proxy_pass https://styles.gpx.studio/;
        proxy_ssl_server_name on;
        proxy_set_header Host styles.gpx.studio;
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json application/*+json text/plain;
        sub_filter_once off;
        sub_filter "https://tiles.gpx.studio" "$scheme://$http_host/gpx-proxy/tiles";
        sub_filter "https://sprites.gpx.studio" "$scheme://$http_host/gpx-proxy/sprites";
        sub_filter "https://fonts.gpx.studio" "$scheme://$http_host/gpx-proxy/fonts";
    }

    location ^~ /gpx-proxy/tiles/ {
        proxy_pass https://tiles.gpx.studio/;
        proxy_ssl_server_name on;
        proxy_set_header Host tiles.gpx.studio;
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json application/*+json text/plain;
        sub_filter_once off;
        sub_filter "https://tiles.gpx.studio" "$scheme://$http_host/gpx-proxy/tiles";
    }

    location ^~ /gpx-proxy/mapterhorn/ {
        proxy_pass https://tiles.mapterhorn.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host tiles.mapterhorn.com;
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json application/*+json text/plain;
        sub_filter_once off;
        sub_filter "https://tiles.mapterhorn.com" "$scheme://$http_host/gpx-proxy/mapterhorn";
    }

    location ^~ /gpx-proxy/sprites/ {
        proxy_pass https://sprites.gpx.studio/;
        proxy_ssl_server_name on;
        proxy_set_header Host sprites.gpx.studio;
    }

    location ^~ /gpx-proxy/fonts/ {
        proxy_pass https://fonts.gpx.studio/;
        proxy_ssl_server_name on;
        proxy_set_header Host fonts.gpx.studio;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
