[project]
name = "gpx-komoot-studio"
version = "0.1.0"
description = "Scripts locaux pour synchroniser et organiser les parcours Komoot en GPX"
requires-python = ">=3.10"
dependencies = [
    "komootgpx>=1.4.3",
]

[project.scripts]
komoot-library = "scripts.komoot_library:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scripts"]
